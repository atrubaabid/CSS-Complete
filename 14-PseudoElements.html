<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<style>
  /* PSEUDO ELEMENTS */

.pe {
  width: 50%;
  height: 300px;
  background-color: aqua;
  margin: 40px auto;
  padding: 60px;
}

.pe h1 {
  margin-bottom: 35px;
  position: relative;
}

/* BEFORE */
.pe1::before {
  content: "\f121";
  font-family: "font awesome 6 free";
  position: absolute;
  top: -22px;
  font-size: 17px;
}

/* AFTER */
.pe1::after {
  content: "";
  border: 1px solid red;
  position: absolute;
  width: 100%;
  bottom: 0;
  left: 0;
}

/* FIRST-LETTER */
.pe p::first-letter {
  color: red;
  font-size: 30px;
}

/* FIRST-LINE */
.pe p::first-line {
  color: purple;
  text-decoration: underline;
}

/* SELECTION */
.pe p::selection {
  background-color: rgb(252, 134, 234);
}
    
</style>
