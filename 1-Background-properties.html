<style>
    /* // BACKGROUND PROPERTIES */

    .box1 {

        width: 100%;
        height: 1000px;
        /* 1 */

        /* 2 */
        background-image: url(images/img\ \(4\).jpg);
        /* 3 */

        /* 4 */

        /* 6 */

        /* 7 */
        /* //blending modes */
        background-blend-mode: saturation;

        /* we can add all values like that also */
        background: aqua url(images/img\ \(1\).jpg) no-repeat right top fixed cover;

    }
</style>
